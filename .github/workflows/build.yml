name: Build executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: SoundPackMaker-linux-x86_64
            file: SoundPackMaker
          - os: windows-latest
            artifact: SoundPackMaker-windows-x86_64
            file: SoundPackMaker.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Supports both layouts:
      # 1. Project files directly in the repository root (recommended).
      # 2. The ZIP's enclosing soundpack-maker/ directory committed as a subfolder.
      - name: Locate Sound Pack Maker project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          project_dir=""

          if [[ -f "build.py" && -f "requirements-build.txt" && -f "src/soundpack_maker.py" ]]; then
            project_dir="."
          else
            while IFS= read -r candidate; do
              candidate_dir="$(dirname "$candidate")"
              if [[ -f "$candidate_dir/requirements-build.txt" && -f "$candidate_dir/src/soundpack_maker.py" ]]; then
                project_dir="$candidate_dir"
                break
              fi
            done < <(find . -mindepth 2 -maxdepth 5 -type f -name build.py \
              -not -path '*/.git/*' -not -path '*/.venv/*' -print)
          fi

          if [[ -z "$project_dir" ]]; then
            echo "Could not locate build.py, requirements-build.txt and src/soundpack_maker.py." >&2
            echo "Put the project files in the repository root, or keep them together in a subfolder." >&2
            echo "Repository files:" >&2
            find . -maxdepth 4 -type f -print | sort >&2
            exit 1
          fi

          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "requirements=$project_dir/requirements-build.txt" >> "$GITHUB_OUTPUT"
          echo "Building from: $project_dir"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ steps.project.outputs.requirements }}

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev

      - name: Install Python dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Build executable
        working-directory: ${{ steps.project.outputs.dir }}
        run: python build.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.project.outputs.dir }}/dist/${{ matrix.file }}
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
